<div #imageContainer
  class="image-placeholder"
  [ngClass]="sizeClass"
  [ngStyle]="styles">
  <!-- Image with loading optimization -->
  @if (hasImage) {
    <div
      class="image-container"
      [class.loaded]="imageLoaded">
      @if (priority) {
        <img ngSrc="{{image}}"
          [width]="containerWidth"
          [height]="containerHeight"
          [alt]="imageAlt"
          [ngStyle]="{'object-fit': objectFit}"
          class="actual-image"
          priority
          (load)="onImageLoad()"
          (error)="onImageError()">
      } @else {
        <img [src]="image"
          [alt]="imageAlt"
          [ngStyle]="{'object-fit': objectFit}"
          class="actual-image"
          (load)="onImageLoad()"
          (error)="onImageError()">
      }
    </div>
  }

  <!-- Placeholder (shown when image is loading, errored, or not provided) -->
  <div [class.hide]="hasImage && imageLoaded"
    class="placeholder-content">
    @if (hasIcon) {
      <img [src]="iconPath"
        [alt]="icon"
        class="placeholder-icon">
    } @else {
      <div class="placeholder-fallback"
        [ngStyle]="textStyles">
        {{ fallbackLetter }}
      </div>
    }

  </div>

  <!-- Optional caption/text -->
  @if (text) {
    <span
      class="placeholder-text"
    [ngStyle]="textStyles">{{ text }}</span>
  }
</div>
