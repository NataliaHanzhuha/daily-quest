<div class="review-card"
  [ngClass]="cardStyle">
  @if (showQuotes) {
    <div
      class="quote-mark top-left">
      <app-image-placeholder
        icon="quote"
        bgColor="transparent"
        iconColor="var(--color-accent, #f76a0c)"
        size="small">
      </app-image-placeholder>
    </div>
  }

  <div class="review-content">
    <p class="review-text">{{ review.content }}</p>
  </div>

  <div class="review-footer">
    <div class="reviewer-info">
      @if (showAvatar) {
        <div
          class="reviewer-avatar">
          <app-image-placeholder
            [image]="review.avatar ?? ''"
            icon="user"
            size="small"
            bgColor="var(--color-accent-light, #fef0e6)"
            iconColor="var(--color-accent, #f76a0c)"
            borderRadius="50%"
            objectFit="cover"
            [alt]="review.name">
          </app-image-placeholder>
        </div>
      }
      <div class="reviewer-details">
        <h4 class="reviewer-name">{{ review.name }}</h4>
        @if (review.service) {
          <p
          class="reviewer-service">{{ review.service }}</p>
        }
      </div>
    </div>

    <div class="review-rating">
      <div class="stars">
        @for (star of ratingArray; track star) {
          <span
            class="star">
            <app-image-placeholder
              icon="star"
              [bgColor]="star ? 'transparent' : 'transparent'"
              [iconColor]="star ? 'var(--color-accent, #f76a0c)' : 'var(--color-muted, #e2e8f0)'"
              size="small">
            </app-image-placeholder>
          </span>
        }
      </div>
      @if (review.date) {
        <span
        class="review-date">{{ review.date }}</span>
      }
    </div>
  </div>

  @if (showQuotes) {
    <div
      class="quote-mark bottom-right">
      <app-image-placeholder
        icon="quote"
        bgColor="transparent"
        iconColor="var(--color-accent, #f76a0c)"
        size="small">
      </app-image-placeholder>
    </div>
  }
</div>
